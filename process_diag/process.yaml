# ===========================================================================
# process_diag settings. Case paths, dates and storm windows come from the
# storyline_diag event configs listed under `events:` (no second copy here).
# ===========================================================================

# Event configs, relative to ../storyline_diag/. Comment out to skip.
events:
  - config.1964.WUS.G-NDG.yaml
  - config.1986.WUS.G-NDG.yaml
  - config.2005.WUS.G-NDG.yaml
  - config.2019.WUS.G-NDG.yaml
  - config.2024.WUS.G-NDG.yaml

# Analysis box [min_lat, min_lon, max_lat, max_lon]. Same as NORCAL in
# storyline_diag/defaults.yaml.
region: [37.0, -124.5, 42.0, -120.0]

# Time window: "storm" = observed_comparison.storm_window of each event,
# "event" = the full time: block.
window: storm

# Hourly instantaneous tape with U, V, Target_U, Target_V, Nudge_U, PS.
stream: eam.h6

# Output folders, relative to process_diag/.
plot_dir: plots
data_dir: output

# --- Block 1: nudging profile (plot_nudge_profile.py) ----------------------
nudge_profile:
  every_hours: 3          # read every Nth hourly record (all 80 levels is heavy at 30x32)
  # Nudge_Vwin_Lindex / Nudge_Vwin_Hindex from user_nl_eam (1-based model
  # level indices). Drawn as reference lines only.
  namelist_window: [44, 61]

# --- Blocks 2-3: structure functions (compute_structure_functions.py) -------
structure_function:
  fields: [U, Target_U, V, Target_V]
  # Nearest model level by the reference `lev` coordinate (hPa at PS = 1000 hPa).
  # Pick one free and one nudged level after looking at block 1.
  levels_hpa: [500, 850]
  every_hours: 1
  r_min_km: 2
  r_max_km: 300
  n_bins: 30              # log-spaced separation bins
  r_exact_km: 60          # all pairs closer than this (snapped to a bin edge)
  n_random_pairs: 3000000 # random pairs for the larger separations
  min_pairs: 200          # bins with fewer pairs are written as NaN

# --- Block 4: precipitation structure functions ------------------------------
# compute_precip_structure_functions.py, plot_precip_sf.py. S2 of hourly
# precipitation for every mesh and obs product, raw and with the event-mean
# field removed, over all land and over land below an elevation limit.
precip_structure_function:
  # Sub-regions [min_lat, min_lon, max_lat, max_lon]. Each active region is computed and
  # plotted separately; outputs go to <data_dir|plot_dir>/.../<REGION>/. NORCAL is the
  # same box as the wind structure functions. The others are first guesses: run
  # plot_precip_masks.py for a region first to check the mesh spacing is uniform there.
  regions:
    NORCAL:   [37.0, -124.5, 42.0, -120.0]
    SIERRA:   [35.5, -121.5, 40.5, -117.5]
    PNW:      [42.0, -125.0, 49.0, -116.0]
    SOCAL:    [32.0, -121.0, 36.0, -114.0]
    INTERIOR: [37.0, -117.0, 45.0, -105.0]
  active_regions: [NORCAL]
  # Per-region overrides of anything in this block (deep-merged), e.g. slope classes set
  # from that region's own terciles, or coarser AORC for a big box.
  region_options:
    PNW:      {obs_options: {AORC: {coarsen: 3}}}
    INTERIOR: {obs_options: {AORC: {coarsen: 4}}}
  stream: eam.h5          # high-frequency mean PRECT (20 / 6.7 / 3.3 min for 30x8 / 30x16 / 30x32)
  variable: PRECT
  accum_hours: 1          # periods (t0 + (k-1)*accum_hours, t0 + k*accum_hours]; 1 matches hourly obs
  obs: [AORC, StageIV]    # hourly products only; skipped when the record doesn't cover the event
  obs_options:            # coarsen = integer block mean of the native grid (1 = native)
    AORC:    {coarsen: 1, r_exact_km: 8}    # ~1 km grid: keep exact pairs short or memory blows up
    StageIV: {coarsen: 1, r_exact_km: 40}
  # One elevation and land field for every product, so each mask covers the
  # same area. Nearest column of this mesh to every point.
  surface:
    resolution: "30x32"
    stream: eam.h4        # PHIS, OCNFRAC
    ocnfrac_max: 0.5      # land = OCNFRAC below this
    slope_radius_km: 12   # terrain slope = least-squares plane through columns within this radius
  # raw = field as is; anom = each point's event mean removed. Add anom back to compute both.
  kinds: [raw]
  # Masks, all land only. name: {elev: [min, max] m, slope: [min, max] m/km};
  # null = no bound, bands are [min, max). A bare number (old form) = maximum elevation.
  # Slope 20 m/km ~ 1.1 deg, 60 m/km ~ 3.4 deg. compute_precip_structure_functions.py
  # prints the land slope percentiles; adjust the classes after the first run.
  masks:
    land: {}
    elev_lt_500:    {elev: [null, 500]}
    elev_500_1500:  {elev: [500, 1500]}
    elev_gt_1500:   {elev: [1500, null]}
    slope_flat:     {slope: [null, 7]}     # NORCAL terciles (~1650 / 2530 / 2270 30x32 columns)
    slope_moderate: {slope: [7, 20]}
    slope_steep:    {slope: [20, null]}
  # One figure per group in the plot scripts (masks missing from the files are skipped).
  mask_groups:
    elevation: [land, elev_lt_500, elev_500_1500, elev_gt_1500]
    slope:     [land, slope_flat, slope_moderate, slope_steep]
  r_min_km: 2
  r_max_km: 300
  n_bins: 30
  r_exact_km: 60          # E3SM; obs_options override per product
  n_random_pairs: 3000000
  min_pairs: 200
