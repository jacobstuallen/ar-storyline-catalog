# 2019 February Russian River flood (Feb 25-27 PST). Santa Rosa 24-hr max 5.56 in; 72-hr totals > 500 mm. VERIFY case names/paths once the rerun exists.
# Everything not set here comes from defaults.yaml.
event_label: "2019_G-NDG"

cases:
  - name: "Storyline_2019_WUS_ne30x8_pg2_G-NDG_v2"
    resolution: "30x8"
    e3sm_dir: "/pscratch/sd/j/jsallen/e3sm_scratch/pm-cpu/Storyline_2019_WUS_ne30x8_pg2_G-NDG_v2/run"
  - name: "Storyline_2019_WUS_ne30x16_pg2_G-NDG_v2"
    resolution: "30x16"
    e3sm_dir: "/pscratch/sd/j/jsallen/e3sm_scratch/pm-cpu/Storyline_2019_WUS_ne30x16_pg2_G-NDG_v2/run"
  - name: "Storyline_2019_WUS_ne30x32_pg2_G-NDG_v2"
    resolution: "30x32"
    e3sm_dir: "/pscratch/sd/j/jsallen/e3sm_scratch/pm-cpu/Storyline_2019_WUS_ne30x32_pg2_G-NDG_v2/run"

time:
  start_year: 2019
  start_month: 2
  start_day: 19
  num_days: 13
  hours_step: 3

active_regions: ["NOR_PAC", "WUS"]

# All times UTC. PST calendar day D = D 08:00 to D+1 08:00 UTC.
observed_comparison:
  storm_window: {start: "2019-02-25 08:00", end: "2019-02-28 08:00"}
  day_window:   {start: "2019-02-26 08:00", end: "2019-02-27 08:00"}
  observed_storm_total_in: 20     # ~72-hr totals > 500 mm; VERIFY vs CW3E summary
  huc10_24hr:
    threshold_in: 5          # 2019's 24-hr peak was ~5.6 in
    bins_in: [0, 1, 2, 3, 4, 5, 6, 8, 10, 12]
